name: RHC check

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Not --frozen-lockfile: package.json pins snapshot.js ^0.17.2 for RHC 4663
      # and the lockfile is regenerated here rather than on a machine that holds
      # wallets.
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit
        env:
          SPACE_ALLOWLIST: 'nvda:0x11dA6f0B92C4e8a37D50b1F9cA26e4B8d07bECdC'
